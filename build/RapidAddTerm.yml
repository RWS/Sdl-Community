resources:
  repositories:
  - repository: AppStoreApplicationsRepo
    type: git
    name: AppStoreApplications/AppStoreApplications
    ref: 'Studio_2026'

trigger:
  branches:
    include:
     - Studio_2026
  paths:
    include:
     - Rapid Add Term/*

pr:
  branches:
    include:
     - Studio_2026
  paths:
    include:
     - Rapid Add Term/*

pool: 
  vmImage : '$(DefaultBuildVm)'

variables:
- template: build/branch-variables.yml@AppStoreApplicationsRepo
- name: buildPlatform
  value: 'Any CPU'
- name: buildConfiguration
  value: 'Release'
- name: solution 
  value: '**/Sdl.Community.RapidAddTerm.sln'
- name: pathToPublish
- name: MultiTermProductIdentifier
  value: MultiTerm19

steps:
  - task: PowerShell@2
    displayName: 'set x86 path'
    inputs:
      targetType: 'inline'
      script: |
        Write-Host "##vso[task.setvariable variable=x86path;]$Env:ProgramFiles(x86)"
  - task: DownloadPipelineArtifact@2
    displayName: 'Download Multiterm Binaries Pipeline Artifact'
    inputs:
      buildType: 'specific'
      project: 'Terminology'
      definition: '2038'
      artifactName: 'binaries'
      buildVersionToDownload: 'latestFromBranch'
      branchName: 'refs/heads/master'
      targetPath: '$(x86path)\Trados\MultiTerm\$(MultiTermProductIdentifier)'
  - template: build/jobs/build-sdlplugin.yml@AppStoreApplicationsRepo
  - template: build/jobs/publish-build-artifact-task.yml@AppStoreApplicationsRepo

